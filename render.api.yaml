services:
  - type: web
    name: mezani-scoresheet-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATA_DIR
        value: /var/data/mezani
      - key: FORMSPREE_ENDPOINT
        value: https://formspree.io/f/myegyagd
    disk:
      name: scoresheet-data
      mountPath: /var/data
      sizeGB: 1
