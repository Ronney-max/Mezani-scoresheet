services:
  - type: web
    name: mezani-scoresheet-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: FRONTEND_ORIGIN
        value: https://mezani-scoresheet-web.onrender.com
      - key: DATA_DIR
        value: /var/data/mezani
      - key: FORMSPREE_ENDPOINT
        value: https://formspree.io/f/myegyagd
    disk:
      name: scoresheet-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: mezani-scoresheet-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://mezani-scoresheet-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
