services:
  - type: web
    name: mezani-scoresheet-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://mezani-scoresheet.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: mezani-scoresheet-db
          property: connectionString
      - key: FORMSPREE_ENDPOINT
        value: https://formspree.io/f/myegyagd
      - key: SENSORY_ACCESS_CODE
        sync: false
      - key: TECHNICAL_ACCESS_CODE
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: AUTH_SECRET
        generateValue: true

databases:
  - name: mezani-scoresheet-db
    plan: free
    region: frankfurt
    databaseName: mezani_scoresheet
    user: mezani_scoresheet
