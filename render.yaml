services:
  - type: web
    name: mezani-scoresheet-api
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATA_DIR
        value: /var/data/mezani
      - key: FORMSPREE_ENDPOINT
        value: https://formspree.io/f/myegyagd
      - key: SENSORY_ACCESS_CODE
        sync: false
      - key: TECHNICAL_ACCESS_CODE
        sync: false
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: AUTH_SECRET
        generateValue: true
    disk:
      name: scoresheet-data
      mountPath: /var/data
      sizeGB: 1
